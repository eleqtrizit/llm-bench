description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "autopep8>=2.3.2",
    "flake8>=7.3.0",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "rich>=15.0.0",
]

[dependency-groups]
