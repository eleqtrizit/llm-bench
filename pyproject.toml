[project]
name = "llm-bench"
version = "0.1.0"
description = "Benchmark tok/s on any OpenAI-compatible server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
llm-bench = "llm_bench.spec_bench:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llm_bench"]

[tool.uv]
package = true
managed = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "autopep8>=2.3.2",
    "flake8>=7.3.0",
    "isort>=9.0.1",
    "mypy>=2.3.1",
]

[tool.pycodestyle]
max-line-length = 120
ignore = ["E251", "E221"]

[tool.isort]
include_trailing_comma = false
use_parentheses = false
line_length = 120

[tool.coverage.run]
omit = ["*/test/*"]
